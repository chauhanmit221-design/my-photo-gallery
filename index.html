<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">

    <title>MIT VISUALS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="site-header">

        <a href="#" class="logo">
            MY PHOTOGRAPHY
        </a>

        <a href="#gallery" class="header-link">
            Gallery
        </a>

    </header>


    <!-- Hero Section -->
    <main>

        <section class="hero">

            <p class="eyebrow">VISUAL STORIES</p>

            <h1>
                Moments<br>
                <span>Worth Remembering.</span>
            </h1>

            <p class="hero-text">
                A collection of moments I've captured.
            </p>

            <a href="#gallery" class="hero-button">
                Explore Gallery ↓
            </a>

        </section>


        <!-- Gallery -->
        <section id="gallery" class="gallery-section">

            <div class="section-heading">

                <p class="eyebrow">MY WORK</p>

                <h2>Selected Photos</h2>

            </div>

            <div class="gallery">
                <!-- Photos load automatically here -->
            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>© 2026 My Photography</p>

        <a href="#gallery">
            View Gallery ↑
        </a>

    </footer>


    <script src="script.js"></script>

</body>

</html>
